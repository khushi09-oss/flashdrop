[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdrop"
version = "1.0.0"
description = "Transactional flash-sale order processing demo"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["flashdrop*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
