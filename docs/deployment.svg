t-size:19px;font-weight:700">Managed data services</text><text text-anchor="middle" x="735.0" y="640.5" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">RDS Multi-AZ + backups</text><text text-anchor="middle" x="735.0" y="666.5" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">MSK + ElastiCache</text><text text-anchor="middle" x="735.0" y="692.5" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Private network / TLS</text><rect stroke-width="2" x="1250" y="585" width="265" height="125" rx="12" fill="white" stroke="#d97706" /><text text-anchor="middle" x="1382.5" y="614.5" fill="#d97706" style="font-family:Arial,sans-serif;font-size:19px;font-weight:700">CloudWatch / alerts</text><text text-anchor="middle" x="1382.5" y="640.5" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">API latency + errors</text><text text-anchor="middle" x="1382.5" y="666.5" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Outbox age + Kafka lag</text><text text-anchor="middle" x="1382.5" y="692.5" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">DB locks + pending age</text><rect stroke-width="2" x="1270" y="290" width="245" height="140" rx="12" fill="white" stroke="#4f46e5" /><text text-anchor="middle" x="1392.5" y="327.0" fill="#4f46e5" style="font-family:Arial,sans-serif;font-size:19px;font-weight:700">Gateway + ALB</text><text text-anchor="middle" x="1392.5" y="353.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Authenticate + throttle</text><text text-anchor="middle" x="1392.5" y="379.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Drain old API tasks</text><text text-anchor="middle" x="1392.5" y="405.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Send to healthy tasks</text><text text-anchor="start" x="50" y="805" fill="#0f172a" style="font-family:Arial,sans-serif;font-size:18px;font-weight:500">Roll back the application image; preserve accepted orders and durable queued work.</text><text text-anchor="start" x="50" y="835" fill="#0f172a" style="font-family:Arial,sans-serif;font-size:18px;font-weight:500">Schema migrations: additive first. Backups: point-in-time recovery plus tested restores.</text><text text-anchor="start" x="50" y="865" fill="#0f172a" style="font-family:Arial,sans-serif;font-size:18px;font-weight:500">CI build checks are supplied. Cloud provisioning, release publishing, and AWS rollout are a deployment plan.</text></svg>