<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569" /></marker></defs><text text-anchor="start" x="50" y="55" fill="#0f172a" style="font-family:Arial,sans-serif;font-size:32px;font-weight:700">FlashDrop | Production architecture</text><text text-anchor="start" x="50" y="90" fill="#334155" style="font-family:Arial,sans-serif;font-size:18px;font-weight:400">Accept safely in one database transaction. Process asynchronously with safe retries.</text><rect stroke-dasharray="8 5" x="235" y="120" width="1320" height="640" rx="18" fill="#eef2ff" stroke="#a5b4fc" /><text text-anchor="start" x="260" y="151" fill="#4338ca" style="font-family:Arial,sans-serif;font-size:15px;font-weight:700">PROPOSED AWS PRODUCTION ENVIRONMENT</text><polyline stroke-width="2" marker-end="url(#arrow)" points="190,360 270,360" fill="none" stroke="#475569" /><text text-anchor="start" x="197" y="345" fill="#334155" style="font-family:Arial,sans-serif;font-size:15px;font-weight:500">HTTPS</text><polyline stroke-width="2" marker-end="url(#arrow)" points="475,360 550,360" fill="none" stroke="#475569" /><text text-anchor="start" x="486" y="345" fill="#334155" style="font-family:Arial,sans-serif;font-size:15px;font-weight:500">Route</text><polyline stroke-width="2" marker-end="url(#arrow)" points="662,300 662,260" fill="none" stroke="#475569" /><text text-anchor="start" x="678" y="283" fill="#334155" style="font-family:Arial,sans-serif;font-size:15px;font-weight:500">Optional</text><polyline stroke-width="2" marker-end="url(#arrow)" points="775,360 890,360" fill="none" stroke="#475569" /><text text-anchor="start" x="787" y="345" fill="#334155" style="font-family:Arial,sans-serif;font-size:15px;font-weight:500">1. Reserve</text><polyline stroke-width="2" marker-end="url(#arrow)" points="1020,435 1020,590" fill="none" stroke="#475569" /><text text-anchor="start" x="1035" y="515" fill="#334155" style="font-family:Arial,sans-serif;font-size:15px;font-weight:500">2. Durable event</text><polyline stroke-width="2" marker-end="url(#arrow)" points="1150,645 1250,645" fill="none" stroke="#475569" /><text text-anchor="start" x="1158" y="625" fill="#334155" style="font-family:Arial,sans-serif;font-size:15px;font-weight:500">3. Publish</text><polyline stroke-width="2" marker-end="url(#arrow)" points="1380,590 1380,435" fill="none" stroke="#475569" /><text text-anchor="start" x="1395" y="515" fill="#334155" style="font-family:Arial,sans-serif;font-size:15px;font-weight:500">4. Consume</text><polyline stroke-width="2" marker-end="url(#arrow)" points="1250,360 1150,360" fill="none" stroke="#475569" /><text text-anchor="start" x="1159" y="345" fill="#334155" style="font-family:Arial,sans-serif;font-size:15px;font-weight:500">5. Confirm</text><rect stroke-width="2" x="40" y="310" width="150" height="100" rx="12" fill="white" stroke="#475569" /><text text-anchor="middle" x="115.0" y="353.0" fill="#475569" style="font-family:Arial,sans-serif;font-size:19px;font-weight:700">Customers</text><text text-anchor="middle" x="115.0" y="379.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Stable retry key</text><rect stroke-width="2" x="270" y="290" width="205" height="140" rx="12" fill="white" stroke="#4f46e5" /><text text-anchor="middle" x="372.5" y="327.0" fill="#4f46e5" style="font-family:Arial,sans-serif;font-size:19px;font-weight:700">Gateway + ALB</text><text text-anchor="middle" x="372.5" y="353.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">JWT authentication</text><text text-anchor="middle" x="372.5" y="379.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Rate limiting</text><text text-anchor="middle" x="372.5" y="405.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Load balancing</text><rect stroke-width="2" x="550" y="300" width="225" height="120" rx="12" fill="white" stroke="#4f46e5" /><text text-anchor="middle" x="662.5" y="340.0" fill="#4f46e5" style="font-family:Arial,sans-serif;font-size:19px;font-weight:700">API instances x N</text><text text-anchor="middle" x="662.5" y="366.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Docker / ECS Fargate</text><text text-anchor="middle" x="662.5" y="392.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Stateless</text><rect stroke-width="2" x="550" y="175" width="225" height="85" rx="12" fill="white" stroke="#d97706" /><text text-anchor="middle" x="662.5" y="210.5" fill="#d97706" style="font-family:Arial,sans-serif;font-size:19px;font-weight:700">Redis / ElastiCache</text><text text-anchor="middle" x="662.5" y="236.5" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Metadata cache only</text><rect stroke-width="2" x="890" y="285" width="260" height="150" rx="12" fill="white" stroke="#059669" /><text text-anchor="middle" x="1020.0" y="327.0" fill="#059669" style="font-family:Arial,sans-serif;font-size:19px;font-weight:700">PostgreSQL / RDS</text><text text-anchor="middle" x="1020.0" y="353.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">INVENTORY AUTHORITY</text><text text-anchor="middle" x="1020.0" y="379.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Stock + orders + outbox</text><text text-anchor="middle" x="1020.0" y="405.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">One atomic transaction</text><rect stroke-width="2" x="890" y="590" width="260" height="110" rx="12" fill="white" stroke="#4f46e5" /><text text-anchor="middle" x="1020.0" y="625.0" fill="#4f46e5" style="font-family:Arial,sans-serif;font-size:19px;font-weight:700">Outbox relay x N</text><text text-anchor="middle" x="1020.0" y="651.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Read committed events</text><text text-anchor="middle" x="1020.0" y="677.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Publish, then mark sent</text><rect stroke-width="2" x="1250" y="590" width="260" height="110" rx="12" fill="white" stroke="#7c3aed" /><text text-anchor="middle" x="1380.0" y="625.0" fill="#7c3aed" style="font-family:Arial,sans-serif;font-size:19px;font-weight:700">Kafka / Amazon MSK</text><text text-anchor="middle" x="1380.0" y="651.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Replicated event log</text><text text-anchor="middle" x="1380.0" y="677.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">At-least-once delivery</text><rect stroke-width="2" x="1250" y="285" width="260" height="150" rx="12" fill="white" stroke="#4f46e5" /><text text-anchor="middle" x="1380.0" y="327.0" fill="#4f46e5" style="font-family:Arial,sans-serif;font-size:19px;font-weight:700">Order workers x N</text><text text-anchor="middle" x="1380.0" y="353.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Docker / ECS Fargate</text><text text-anchor="middle" x="1380.0" y="379.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">PENDING to CONFIRMED</text><text text-anchor="middle" x="1380.0" y="405.0" fill="#334155" style="font-family:Arial,sans-serif;font-size:16px;font-weight:400">Commit DB, then ACK</text><text text-anchor="start" x="50" y="805" fill="#0f172a" style="font-family:Arial,sans-serif;font-size:18px;font-weight:500">Redis outages do not change accepted orders. PostgreSQL is authoritative for inventory and retry keys.</text><text text-anchor="start" x="50" y="835" fill="#0f172a" style="font-family:Arial,sans-serif;font-size:18px;font-weight:500">Outbox closes the DB-to-broker crash gap. Duplicate events are safe because confirmation is conditional.</text><text text-anchor="start" x="50" y="865" fill="#0f172a" style="font-family:Arial,sans-serif;font-size:18px;font-weight:500">Local runnable version: SQLite + durable jobs table. Cloud components shown here are the production design.</text></svg>